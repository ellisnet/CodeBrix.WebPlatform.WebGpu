# codebrix-webgpu-graphics: the first-party crate of the CodeBrix.WebPlatform.WebGpu.Graphics
# package. It is NOT published on crates.io: the package carries it in its crate archive
# (webgpu-graphics-crates.zip) in vendored form, and the platform's frontend build writes it into
# the application's vendor folder beside the crates of the WebGpu package (wgpu, glam and
# codebrix-webgpu), which this package depends on. A frontend names it like any crate:
#     codebrix-webgpu-graphics = "1.0"
#
# EVERY DEPENDENCY IS AN EXACT VERSION that the WebGpu package's crates carry (the maintainer
# tool checks it). It depends on codebrix-webgpu and NEVER on anything of the Animation package.
#
# Change `version` whenever the crate's content changes in a release of the package: cargo treats
# a name and version from a vendor folder as unchanging.
[package]
name = "codebrix-webgpu-graphics"
version = "1.8.0"
edition = "2021"
publish = false
description = "2D and 3D graphics through WebGPU for CodeBrix.WebPlatform frontends: the GraphicsContext, frames, resources, pipelines, sprites, lit meshes, PBR models with skinning, morph targets and animation playback, glTF loading, image-based lighting and tone mapping, animated textures, render bundles, indirect draws, compute, queries and texture readback of CodeBrix.WebGpu.Graphics, with culling, level of detail, point and spot lights, sun and spot shadows, multisampling, bloom, a glow layer, GPU particles, frame timings and water (a simulated wave field, open-water waves and a water surface), as a layer on the codebrix-webgpu canvas host."
license = "Apache-2.0"
repository = "https://github.com/ellisnet/CodeBrix.WebPlatform.WebGpu"

[dependencies]
# The context, the canvas host, its layers and its one clock; and through it wgpu and glam.
codebrix-webgpu = "=1.3.0"
# WebGPU in the browser only: the WebGpu package's features, no WebGL, no native backend.
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "webgpu", "wgsl"] }
# The maths types (System.Numerics' counterparts), under glam's own names.
glam = { version = "=0.34.3", features = ["bytemuck"] }
# Plain-old-data values written into buffers as bytes (no derive: no procedural macro).
bytemuck = "=1.25.2"
# glTF 2.0 documents (the parsing layer of src/gltf/: JSON, the .glb container, validation, accessor
# and animation readers). The Graphics package's own crate set carries it, with DEFAULT FEATURES OFF
# (no file reading, no image decoding: the application hands over every byte, and PNG and JPEG go
# through codebrix-webgpu). The features are the crate set's, exactly.
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extensions", "KHR_materials_emissive_strength", "KHR_texture_transform", "KHR_materials_ior", "KHR_materials_pbrSpecularGlossiness", "KHR_materials_specular", "KHR_materials_transmission", "KHR_materials_unlit", "allow_empty_texture"] }
