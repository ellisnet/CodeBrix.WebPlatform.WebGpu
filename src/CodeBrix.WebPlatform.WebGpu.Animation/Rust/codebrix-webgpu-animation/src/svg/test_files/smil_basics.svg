<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Written for the crate's tests: time-based SMIL - animate, set, animateTransform. -->
  <rect id="fader" x="0" y="0" width="10" height="10" fill="#ff0000" opacity="0">
    <animate attributeName="opacity" values="0;1;0.5" keyTimes="0;0.25;1" dur="4s" begin="1s" fill="freeze"/>
  </rect>
  <rect id="spinner" x="40" y="40" width="20" height="20" fill="#00ff00">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect id="slider" x="0" y="80" width="10" height="10" fill="#0000ff" transform="translate(5 0)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 0" dur="4s" additive="sum" fill="remove"/>
  </rect>
  <circle id="blinker" cx="80" cy="20" r="5" fill="#000000">
    <set attributeName="visibility" to="hidden" begin="2s" dur="1s"/>
    <animate attributeName="fill" from="#000000" to="#ff0000" dur="2s" fill="freeze"/>
  </circle>
  <circle cx="80" cy="60" r="5" fill="#000000" stroke="#000" stroke-width="1">
    <animate attributeName="stroke-width" by="4" dur="1s" repeatCount="3" accumulate="sum" fill="freeze"/>
  </circle>
  <rect id="clicked" x="0" y="0" width="5" height="5">
    <animate attributeName="opacity" from="1" to="0" dur="1s" begin="click"/>
    <animate attributeName="x" from="0" to="10" dur="1s"/>
  </rect>
</svg>
