<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Written for the crate's tests: keySplines, discrete, paced, syncbase chains, repeatDur, end. -->
  <rect id="eased" x="0" y="0" width="10" height="10" fill="#000">
    <animate attributeName="opacity" values="0;1" keySplines="0.42 0 0.58 1" calcMode="spline" dur="2s" fill="freeze"/>
  </rect>
  <rect id="stepped" x="20" y="0" width="10" height="10" fill="#000">
    <animate attributeName="fill" values="#ff0000;#00ff00;#0000ff" calcMode="discrete" dur="3s" fill="freeze"/>
  </rect>
  <rect id="paced" x="40" y="0" width="10" height="10" fill="#000">
    <animate attributeName="stroke-width" values="0;1;4" calcMode="paced" dur="4s" fill="freeze"/>
  </rect>
  <rect id="pinger" x="0" y="40" width="10" height="10" fill="#000">
    <animate id="ping" attributeName="opacity" from="1" to="0" dur="1s" begin="0s;pong.end"/>
    <animate id="pong" attributeName="opacity" from="0" to="1" dur="1s" begin="ping.end"/>
  </rect>
  <rect id="limited" x="20" y="40" width="10" height="10" fill="#000">
    <animate attributeName="opacity" from="0" to="1" dur="1s" repeatDur="2.5s" fill="freeze"/>
  </rect>
  <rect id="ended" x="40" y="40" width="10" height="10" fill="#000">
    <animate attributeName="opacity" from="0" to="1" dur="10s" end="2s" fill="freeze"/>
  </rect>
  <rect id="toward" x="60" y="40" width="10" height="10" fill="#000" opacity="0.2">
    <animate attributeName="opacity" to="1" dur="2s" begin="1s"/>
  </rect>
</svg>
