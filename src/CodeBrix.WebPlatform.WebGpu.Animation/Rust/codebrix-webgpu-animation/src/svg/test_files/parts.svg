<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="100" viewBox="0 0 400 200">
  <!-- Written for the crate's tests: every kind of thing the scene carries or reports. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="1" stop-color="#0000ff" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="window"><rect x="0" y="0" width="100" height="100"/></clipPath>
    <mask id="fade" mask-type="alpha"><rect x="0" y="0" width="400" height="200" fill="white" fill-opacity="0.5"/></mask>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="odd"><feMorphology radius="2"/></filter>
    <g id="tooth"><rect id="tooth-body" x="0" y="0" width="10" height="10" fill="#00ff00"/></g>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.25" fy="0.25" spreadMethod="reflect"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="lum"><rect x="0" y="0" width="400" height="200" fill="#808080"/></mask>
  </defs>
  <g id="gear" transform="translate(100 50)" opacity="0.5">
    <rect id="body" x="-20" y="-20" width="40" height="40" fill="url(#sky)" stroke="#000" stroke-width="4" stroke-dasharray="5 3"/>
  </g>
  <rect id="moved" x="10" y="10" width="20" height="20" transform="translate(5 0)" fill="#123456"/>
  <g id="clipped" clip-path="url(#window)"><circle cx="50" cy="50" r="80" fill="#ff8800"/></g>
  <g id="masked" mask="url(#fade)"><rect x="200" y="0" width="50" height="50" fill="#880088"/></g>
  <use id="t1" xlink:href="#tooth" x="300" y="10"/>
  <use id="t2" xlink:href="#tooth" x="320" y="10"/>
  <rect id="patterned" x="0" y="150" width="40" height="40" fill="url(#dots)"/>
  <rect id="blurred" x="50" y="150" width="40" height="40" fill="#000" filter="url(#soft)"/>
  <rect id="oddfilter" x="100" y="150" width="40" height="40" fill="#000" filter="url(#odd)"/>
  <line id="hand" x1="200" y1="100" x2="200" y2="20" stroke="#e0506e" stroke-width="3" stroke-linecap="round"/>
  <image id="photo" x="300" y="100" width="64" height="48" href="pictures/photo.png"/>
  <text x="10" y="190">PER-PART</text>
  <circle id="lit" cx="350" cy="170" r="20" fill="url(#glow)" mask="url(#lum)"/>
  <image id="embedded" x="250" y="150" width="8" height="4" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAACCAYAAAAAAAAA"/>
  <rect id="hidden" x="0" y="0" width="5" height="5" visibility="hidden" fill="#000"/>
</svg>
