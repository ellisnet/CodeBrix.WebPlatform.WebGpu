<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Written for the crate's tests: the CSS @keyframes subset. -->
  <style>
    /* a spinner turning about its own centre */
    .spin { animation: spin 2s linear infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #pulse { animation-name: pulse; animation-duration: 1s; animation-iteration-count: 2; animation-direction: alternate; animation-timing-function: steps(4, end); animation-fill-mode: forwards; }
    @keyframes pulse { 0% { opacity: 0 } 100% { opacity: 1 } }
    g > .draw { animation: draw 4s cubic-bezier(0.42, 0, 0.58, 1) 1s both; }
    @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; stroke: #ff0000; } }
    #slide { animation: slide 2s linear; }
    @keyframes slide { 50% { transform: translate(10px, 20px); } }
    @media (prefers-reduced-motion) { .spin { animation: none; } }
    svg [data-x] { animation: spin 1s; }
  </style>
  <rect class="spin" x="10" y="10" width="20" height="20" fill="#000"/>
  <rect id="pulse" x="50" y="10" width="20" height="20" fill="#000"/>
  <g><path class="draw" d="M 0 50 L 100 50" stroke="#000" stroke-width="2" stroke-dasharray="100 100" fill="none"/></g>
  <rect id="slide" x="0" y="80" width="10" height="10" fill="#000"/>
</svg>
