<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100">
  <!-- Written for the crate's tests: animateMotion along a path (rotate auto) and through points. -->
  <path id="track" d="M 0 0 L 100 0 L 100 100" fill="none" stroke="#999"/>
  <rect id="car" x="-5" y="-5" width="10" height="10" fill="#e00">
    <animateMotion dur="4s" rotate="auto" fill="freeze"><mpath href="#track"/></animateMotion>
  </rect>
  <circle id="ball" cx="0" cy="0" r="3" fill="#00e">
    <animateMotion values="0,0; 10,0; 10,30" dur="3s" calcMode="linear"/>
  </circle>
</svg>
