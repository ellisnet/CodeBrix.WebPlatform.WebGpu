<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="400" viewBox="0 0 600 400">
  <!-- Written for the GraphicsDemo sample: the document animates itself with time-based SMIL. -->
  <rect width="600" height="400" rx="18" fill="#1b1f30"/>
  <!-- A road and a car driving along it: animateMotion with an mpath, turned with the road. -->
  <path id="road" d="M 40 330 C 140 230, 220 380, 320 300 S 480 180, 560 260" fill="none" stroke="#3a4060" stroke-width="22" stroke-linecap="round"/>
  <path d="M 40 330 C 140 230, 220 380, 320 300 S 480 180, 560 260" fill="none" stroke="#ecedf4" stroke-width="2" stroke-dasharray="12 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1s" repeatCount="indefinite"/>
  </path>
  <g id="car">
    <rect x="-18" y="-9" width="36" height="18" rx="5" fill="#f0a848"/>
    <rect x="4" y="-7" width="9" height="14" rx="2" fill="#1b1f30"/>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#road"/></animateMotion>
  </g>
  <!-- A traffic light whose lamps hand over to each other with syncbase begins (a loop). -->
  <rect x="40" y="40" width="44" height="120" rx="10" fill="#0c0e18"/>
  <circle cx="62" cy="64" r="14" fill="#3a1820"><set id="red" attributeName="fill" to="#e0506e" begin="0s; green.end" dur="2s"/></circle>
  <circle cx="62" cy="100" r="14" fill="#3a3018"><set id="amber" attributeName="fill" to="#f0c048" begin="red.end" dur="0.8s"/></circle>
  <circle cx="62" cy="136" r="14" fill="#183a20"><set id="green" attributeName="fill" to="#8ce6a0" begin="amber.end" dur="2s"/></circle>
  <!-- A windmill turning about its hub; its sail colour changes at keyTimes (discrete). -->
  <g transform="translate(180 110)">
    <rect x="-5" y="0" width="10" height="70" fill="#848aa4"/>
    <g id="sails" fill="#ecedf4">
      <path d="M 0 0 L 8 -50 L -8 -50 Z"/><path d="M 0 0 L 50 8 L 50 -8 Z"/><path d="M 0 0 L -8 50 L 8 50 Z"/><path d="M 0 0 L -50 -8 L -50 8 Z"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#ecedf4;#78b4ff;#8ce6a0" keyTimes="0;0.4;0.7" calcMode="discrete" dur="3s" repeatCount="indefinite"/>
    </g>
    <circle r="6" fill="#f0a848"/>
  </g>
  <!-- A ball bouncing with keySplines (calcMode spline) and squashing with an additive scale. -->
  <line x1="280" y1="170" x2="360" y2="170" stroke="#848aa4" stroke-width="2"/>
  <g id="ball" transform="translate(320 60)">
    <circle r="16" fill="#e0506e"/>
    <animateTransform attributeName="transform" type="translate" values="320 60; 320 154; 320 60" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.5 0 1 1; 0 0 0.5 1" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <!-- A GROUP whose fill animates: the two squares without a fill of their own follow it; the
       middle one sets its own white fill and keeps it (as browsers do). -->
  <g id="swatches" fill="#78b4ff">
    <rect x="420" y="50" width="36" height="36" rx="4"/>
    <rect x="466" y="50" width="36" height="36" rx="4" fill="#ecedf4"/>
    <rect x="512" y="50" width="36" height="36" rx="4"/>
    <animate attributeName="fill" values="#78b4ff;#e0506e;#8ce6a0;#78b4ff" dur="4s" repeatCount="indefinite"/>
  </g>
  <!-- A pulse: opacity with values, a ring growing by animateTransform scale, accumulated. -->
  <g transform="translate(484 150)">
    <circle r="22" fill="none" stroke="#8ce6a0" stroke-width="4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.6;1.2;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- A line drawing itself (stroke-dashoffset) after 1 s, held with fill="freeze". -->
  <path d="M 120 230 q 25 -40 50 0 t 50 0 t 50 0" fill="none" stroke="#f0a848" stroke-width="4" stroke-dasharray="210" stroke-dashoffset="210">
    <animate attributeName="stroke-dashoffset" from="210" to="0" begin="1s" dur="2.5s" fill="freeze"/>
  </path>
  <!-- Not played, and reported: a click begin. -->
  <circle cx="570" cy="370" r="8" fill="#848aa4"><animate attributeName="opacity" from="1" to="0" dur="1s" begin="click"/></circle>
</svg>
